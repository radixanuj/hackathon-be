document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ap;color:#6E6A62\">\n              <span style=\"width:7px;height:7px;border-radius:999px;background:var(--acc);flex:none\"><\u002Fspan>{{ k.label }}\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:32px\">\n        <article style=\"grid-column:span 2;min-width:0;position:relative;overflow:hidden;background:var(--acc);color:var(--on-acc);border-radius:26px;padding:34px;animation:rise .6s .05s both;transition:transform .35s cubic-bezier(.2,.9,.3,1)\" style-hover=\"transform:translateY(-6px)\">\n          <div style=\"position:absolute;inset:0;opacity:.14;background:linear-gradient(100deg,transparent 20%,#fff 50%,transparent 80%);animation:sweep 6s 1.4s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;right:-40px;bottom:-70px;width:240px;height:240px;border-radius:999px;border:2px solid currentColor;opacity:.28\"><\u002Fdiv>\n          <span style=\"position:absolute;top:22px;right:24px;transform:rotate(-6deg);background:var(--inv);color:var(--on-inv);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\">{{ meetupSticker }}<\u002Fspan>\n          <div style=\"position:relative;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between\">\n            <div style=\"max-width:520px;min-width:240px\">\n              <p style=\"margin:0 0 12px;font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75\">Blind Meetup<\u002Fp>\n              <h2 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.02;letter-spacing:-.03em\">{{ meetupHeadline }}<\u002Fh2>\n              <p style=\"margin:14px 0 0;font-size:18px;line-height:1.45;opacity:.86\">Meet someone at Radix you probably wouldn't otherwise talk to. One 5.5px;font-weight:700;cursor:pointer;min-height:48px;transition:border-color .2s,transform .2s\" style-hover=\"border-color:#14120F;transform:translateY(-2px)\">View profile<\u002Fbutton>\n        <\u002Farticle>\n\n        <article style=\"min-width:0;position:relative;overflow:hidden;background:#FAF8F4;border:1.5px dashed var(--acc-soft);border-radius:26px;padding:28px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;animation:rise .6s .16s both\">\n          <span style=\"position:absolute;top:18px;right:-6px;transform:rotate(7deg);background:var(--acc);color:var(--on-acc);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Pot luck<\u002Fspan>\n          <div style=\"min-height:118px;display:grid;place-items:center;position:relative\">\n            <sc-if value=\"{{ rxIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size:60px;line-height:1;cursor:pointer;transition:transform .3s\" style-hover=\"animation:wiggle .5s ease-in-out infinite\">🎲<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rxRolling }}\">\n              <span style=\"position:relative;display:block;width:120px;height:110px\">\n                <span style=\"position:absolute;left:0;top:6px;width:62px;height:78px;border-radius:16px;background:#EFE6D8;animation:shuffleA .5s ease-in-out infinite\"><\u002Fspan>\n                <span style=\"position:absolute;left:28px;top:0;width:62px;height:78px;border-radius:16px;background:var(--acc);animation:shuffleB .55s ease-in-out infinite\"><\u002Fspan>\n                <span style=\"position:absolute;left:56px;top:10px;width:62px;height:78px;border-radius:16px;background:#E3E7DF;animation:shuffleC .45s ease-in-out infinite\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ rxPicked }}\">\n              <span style=\"display:flex;align-items:center;gap:14px;animation:tada .6s cubic-bezier(.2,1.4,.3,1) both\">\n                <span style=\"width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-family:'Bricolage Grotesque',serif;font-size:25px;font-weight:800;flex:none;background:{{ rxAv }}\">{{ rxInitials }}<\u002Fspan>\n                <span style=\"min-width:0\">\n                  <span style=\"display:block;font-family:'Bricolage Grotesque',serif;font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ rxName }}<\u002Fspan>\n                  <span style=\"display:block;margin-top:3px;font-size:15px;color:#6E6A62\">{{ rxMeta }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0 0 6px;font-family:'Bricolage Grotesque',serif;font-size:23px;font-weight:700;letter-spacing:-.022em\">{{ rxTitle }}<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.45;color:#6E6A62\">{{ rxLine }}<\u002Fp>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ rxSpin }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:14px;padding:13px 20px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .22s cubic-bezier(.2,1.5,.3,1)\" style-hover=\"transform:rotate(-2deg) scale(1.05)\">{{ rxCta }}<\u002Fbutton>\n              <sc-if value=\"{{ rxPicked }}\">\n                <button sc-camel-on-click=\"{{ rxOpen }}\" style=\"background:#fff;border:1.5px solid #E3DED5;border-radius:14px;padding:13px 18px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px\" style-hover=\"border-color:#14120F\">View profile<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"min-width:0;background:#FAF8F4;border:1px solid #F1EDE6;border-radius:26px;padding:28px;animation:rise .6s .18s both;transition:transform .35s cubic-bezier(.2,.9,.3,1)\" style-hover=\"transform:translateY(-6px)\">\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:25px;font-weight:700;letter-spacing:-.02em\">Want to learn something?<\u002Fh3>\n          <p style=\"margin:8px 0 20px;font-size:16px;color:#6E6A62\">People here have offered to talk about:<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n            <sc-for list=\"{{ learnTags }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"background:#fff;border:1.5px solid #EBE6DE;border-radius:999px;padding:11px 17px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .22s cubic-bezier(.2,1.4,.3,1),background .22s,border-color .22s,color .22s\" style-hover=\"transform:translateY(-3px) rotate(-1.5deg);background:var(--acc);border-color:var(--acc);color:var(--on-acc)\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"min-width:0;background:#fff;border:1px solid #ECE8E1;border-radius:26px;padding:28px;animation:rise .6s .24s both;transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px) rotate(.5deg);box-shadow:0 20px 44px rgba(20,18,15,.09)\">\n          <p style=\"margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9A948A\">This weekend<\u002Fp>\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.1\">Sunday Morning Run<br>— Dubai<\u002Fh3>\n          <div style=\"display:flex;align-items:center;gap:12px;margin:20px 0 22px\">\n            <div style=\"display:flex\">\n              <sc-for list=\"{{ runAvatars }}\" as=\"a\" hint-placeholder-count=\"5\">\n                <span style=\"width:38px;height:38px;border-radius:999px;background:#EFE6D8;border:2.5px solid #fff;margin-left:-10px;display:grid;place-items:center;font-size:13px;font-weight:700\">{{ a.i }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-size:15.5px;color:#6E6A62\">{{ runCount }} joining<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ runJoined }}\">\n            <div style=\"display:flex;align-items:center;gap:10px;background:var(--tint);color:var(--acc-ink);border-radius:14px;padding:13px 18px;font-size:15.5px;font-weight:700;animation:pop .45s cubic-bezier(.2,1.5,.3,1) both\">\n              <span style=\"width:22px;height:22px;border-radius:999px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:13px\">✓<\u002Fspan>You're in\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ runOpen }}\">\n            <button sc-camel-on-click=\"{{ joinRun }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.05)\">I'm in<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Farticle>\n\n        <article style=\"min-width:0;background:#fff;border:1px solid #ECE8E1;border-radius:26px;padding:28px;animation:rise .6s .3s both;transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s\" style-hover=\"transform:translateY(-6px);box-shadow:0 20px 44px rgba(20,18,15,.09)\">\n          <p style=\"margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9A948A\">Recommended by Priya<\u002Fp>\n          <div style=\"display:flex;gap:16px;align-items:flex-start\">\n            <span style=\"width:58px;height:76px;border-radius:10px;background:var(--acc);flex:none\"><\u002Fspan>\n            <div style=\"min-width:0\">\n              <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15\">Acquired: The Nintendo Episode<\u002Fh3>\n              <p style=\"margin:8px 0 0;font-size:16px;line-height:1.5;color:#6E6A62\">\"Three hours on a playing-card company. I've thought about pricing differently ever since.\"<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goLearnShare }}\" style=\"margin-top:22px;background:none;border:none;padding:0;font-size:15.5px;font-weight:700;color:var(--acc-ink);cursor:pointer\">More recommendations →<\u002Fbutton>\n        <\u002Farticle>\n\n        <article style=\"grid-column:span 2;min-width:0;background:#14120F;color:#fff;border-radius:26px;padding:0;overflow:hidden;animation:rise .6s .36s both;transition:transform .35s cubic-bezier(.2,.9,.3,1)\" style-hover=\"transform:translateY(-6px)\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))\">\n            <div style=\"position:relative;min-height:250px\">\n              <image-slot id=\"rx-story-hyrox\" shape=\"rect\" placeholder=\"Drop Ananya's HYROX photo\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"padding:32px\">\n              <p style=\"margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-soft)\">Story<\u002Fp>\n              <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-.028em;line-height:1.06\">Ananya just finished her first HYROX<\u002Fh3>\n              <p style=\"margin:14px 0 24px;font-size:16.5px;line-height:1.5;color:#B9B4AB\">\"I signed up as a joke in January. Then I had to actually do it.\"<\u002Fp>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ goStories }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:14px;padding:13px 22px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.04)\">Read story<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ askAnanya }}\" style=\"background:none;color:#fff;border:1.5px solid #3B3833;border-radius:14px;padding:13px 22px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;transition:border-color .2s\" style-hover=\"border-color:#fff\">Ask her anything<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPeople }}\">\n      <section style=\"padding:52px 0 0;animation:rise .5s both\">\n        <h1 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(36px,5vw,58px);line-height:1;letter-spacing:-.035em;max-width:620px;text-wrap:pretty\">Find someone worth talking to<\u002Fh1>\n        <div style=\"position:relative;margin:30px 0 24px;max-width:660px\">\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search skills, interests, teams or people...\" style=\"width:100%;border:1.5px solid #E3DED5;border-radius:18px;padding:20px 22px;font-size:18px;background:#fff;outline:none;color:#14120F\" style-focus=\"border-color:var(--acc);box-shadow:0 0 0 4px var(--tint)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px\">\n          <sc-for list=\"{{ filterGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <sc-if value=\"{{ g.on }}\">\n              <button sc-camel-on-click=\"{{ g.go }}\" style=\"background:#14120F;color:#fff;border:1.5px solid #14120F;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer\">{{ g.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ g.off }}\">\n              <button sc-camel-on-click=\"{{ g.go }}\" style=\"background:#fff;color:#6E6A62;border:1.5px solid #EBE6DE;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .2s,color .2s\" style-hover=\"border-color:#14120F;color:#14120F\">{{ g.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;min-height:46px\">\n          <sc-for list=\"{{ filterTags }}\" as=\"t\" hint-placeholder-count=\"8\">\n            <sc-if value=\"{{ t.on }}\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:999px;padding:10px 17px;font-size:14.5px;font-weight:700;cursor:pointer;animation:pop .35s cubic-bezier(.2,1.5,.3,1) both\">{{ t.label }} ✕<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.off }}\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"background:#F7F4EF;color:#14120F;border:none;border-radius:999px;padding:10px 17px;font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .22s cubic-bezier(.2,1.4,.3,1),background .2s\" style-hover=\"transform:translateY(-2px);background:var(--tint)\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:28px 0 18px;font-size:15.5px;color:#9A948A;font-weight:600\">{{ peopleCount }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px\">\n          <sc-for list=\"{{ peopleList }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <article sc-camel-on-click=\"{{ p.open }}\" style=\"min-width:0;background:#fff;border:1px solid #ECE8E1;border-radius:24px;padding:24px;cursor:pointer;animation:rise .5s both;transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s,border-color .35s\" style-hover=\"transform:translateY(-7px);box-shadow:0 22px 46px rgba(20,18,15,.10);border-color:#DFD9CF\">\n              <div style=\"display:flex;gap:15px;align-items:center\">\n                <span style=\"width:66px;height:66px;border-radius:19px;display:grid;place-items:center;flex:none;font-family:'Bricolage Grotesque',serif;font-size:24px;font-weight:800;background:{{ p.av }}\">{{ p.initials }}<\u002Fspan>\n                <div style=\"min-width:0\">\n                  <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:22px;font-weight:700;letter-spacing:-.02em\">{{ p.name }}<\u002Fh3>\n                  <p style=\"margin:3px 0 0;font-size:15px;color:#6E6A62\">{{ p.meta }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:22px 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">Can talk about<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ p.talk2 }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <span style=\"background:var(--tint);color:var(--acc-ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600\">{{ t }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:18px 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">Into<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ p.into2 }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <span style=\"background:#F7F4EF;color:#14120F;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600\">{{ t }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:22px 0 0;font-size:15.5px;font-weight:700;color:var(--acc-ink)\">{{ p.cta }} →<\u002Fp>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noPeople }}\">\n          <div style=\"border:1.5px dashed #E3DED5;border-radius:24px;padding:54px;text-align:center;animation:fade .3s both\">\n            <p style=\"margin:0;font-size:19px;font-weight:700\">Nobody matches that yet.<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:16.5px;color:#6E6A62\">Try a broader interest — or clear the filters.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isConnect }}\">\n      <section style=\"padding:52px 0 0;animation:rise .5s both\">\n        <div style=\"position:relative;overflow:hidden;background:var(--acc);color:var(--on-acc);border-radius:30px;padding:clamp(28px,4vw,52px)\">\n          <div style=\"position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:999px;border:2px solid currentColor;opacity:.3;animation:floatC 14s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;right:120px;bottom:-90px;width:180px;height:180px;border-radius:999px;background:rgba(255,255,255,.14)\"><\u002Fdiv>\n          <div style=\"position:relative;max-width:620px\">\n            <p style=\"margin:0 0 14px;font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.78\">Blind Meetup<\u002Fp>\n            <h1 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(36px,5.4vw,62px);line-height:.99;letter-spacing:-.035em\">One hour. One colleague you don't know. No agenda.<\u002Fh1>\n            <p style=\"margin:18px 0 0;font-size:19px;line-height:1.45;opacity:.88\">Every month we pair people across teams and continents. You get a name, a coffee slot and an hour without a to-do list.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:38px;max-width:820px\">\n            <div style=\"background:rgba(255,255,255,.16);border-radius:20px;padding:22px\">\n              <p style=\"margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8\">September round<\u002Fp>\n              <p style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:26px;font-weight:700;letter-spacing:-.02em\">Signup closes<br>23 September<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.16);border-radius:20px;padding:22px\">\n              <p style=\"margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8\">The meetup<\u002Fp>\n              <p style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:26px;font-weight:700;letter-spacing:-.02em\">Last Friday<br>of September<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.16);border-radius:20px;padding:22px\">\n              <p style=\"margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8\">Pairing<\u002Fp>\n              <p style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:26px;font-weight:700;letter-spacing:-.02em\">6+ years ↔<br>Under 6 years<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:30px\">\n            <sc-for list=\"{{ meetupRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <span style=\"display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:600\">\n                <span style=\"width:24px;height:24px;border-radius:999px;background:var(--inv);color:var(--on-inv);display:grid;place-items:center;font-size:13px;flex:none\">✓<\u002Fspan>{{ r.label }}\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"position:relative;margin-top:36px\">\n            <sc-if value=\"{{ meetupIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ startMatch }}\" style=\"background:var(--inv);color:var(--on-inv);border:none;border-radius:16px;padding:19px 32px;font-size:18px;font-weight:700;cursor:pointer;min-height:58px;transition:transform .25s cubic-bezier(.2,1.3,.3,1);box-shadow:0 10px 28px rgba(20,18,15,.18)\" style-hover=\"transform:translateY(-3px) scale(1.02)\">Join this month's meetup<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ meetupDone }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--inv);color:#14120F;border-radius:20px;padding:20px 24px;animation:springIn .6s both\">\n                <span style=\"width:52px;height:52px;border-radius:15px;background:#E3E7DF;display:grid;place-items:center;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:19px;flex:none\">MR<\u002Fspan>\n                <div style=\"min-width:0\">\n                  <p style=\"margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9A948A\">You're in for September<\u002Fp>\n                  <p style=\"margin:3px 0 0;font-family:'Bricolage Grotesque',serif;font-size:23px;font-weight:700;letter-spacing:-.02em\">Matched with Maya Rao<\u002Fp>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ showMatch }}\" style=\"margin-left:auto;background:var(--acc);color:var(--on-acc);border:none;border-radius:13px;padding:13px 20px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px\">See match<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:64px\">\n          <h2 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(30px,4vw,46px);letter-spacing:-.032em;line-height:1.02\">Learn from someone at Radix<\u002Fh2>\n          <p style=\"margin:12px 0 26px;font-size:18.5px;color:#6E6A62;max-width:560px\">Pick a topic. We'll show you who ay:grid;place-items:center;flex:none;font-family:'Bricolage Grotesque',serif;font-size:21px;font-weight:800;background:{{ p.av }}\">{{ p.initials }}<\u002Fspan>\n                      <div style=\"min-width:0\">\n                        <h3 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-size:20.5px;font-weight:700;letter-spacing:-.02em\">{{ p.name }}<\u002Fh3>\n                        <p style=\"margin:3px 0 0;font-size:14.5px;color:#6E6A62\">{{ p.meta }}<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <p style=\"margin:18px 0 20px;font-size:16px;line-height:1.5;color:#14120F\">{{ p.offer }}<\u002Fp>\n                    <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n                      <button sc-camel-on-click=\"{{ p.request }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:13px;padding:13px 20px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.04)\">Request 30 mins<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ p.open }}\" style=\"background:none;border:1.5px solid #E3DED5;border-radius:13px;padding:13px 18px;font-size:15.5px;font-weight:700;cursor:pointer;min-height:48px\" style-hover=\"border-color:#14120F\">Profile<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Farticle>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCommunity }}\">\n      <section style=\"padding:52px 0 0;animation:rise .5s both\">\n        <h1 style=\"margin:0 0 26px;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(36px,5vw,58px);line-height:1;letter-spacing:-.035em\">Community<\u002Fh1>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #F1ED ht:800;font-size:clamp(30px,4vw,44px);line-height:1;letter-spacing:-.035em\">{{ prof.name }}<\u002Fh2>\n            <p style=\"margin:10px 0 0;font-size:18.5px;color:#6E6A62\">{{ prof.meta }}<\u002Fp>\n            <p style=\"margin:4px 0 0;font-size:16.5px;font-weight:700;color:var(--acc-ink)\">{{ prof.years }}<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ requestProf }}\" style=\"margin-left:auto;background:var(--acc);color:var(--on-acc);border:none;border-radius:15px;padding:17px 26px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.04)\">Request 30 mins<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:28px 0 0;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">About me<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:18px;line-height:1.55;max-width:620px\">{{ prof.about }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:30px\">\n          <div style=\"min-width:0\">\n            <p style=\"margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">Can talk about<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ prof.talk }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <span style=\"background:var(--tint);color:var(--acc-ink);border-radius:999px;padding:10px 16px;font-size:15.5px;font-weight:600\">{{ t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <p style=\"margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">Want to learn<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ pro :10px 0 0;font-size:16.5px;line-height:1.5;color:#6E6A62\">{{ prof.storyBody }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasRequest }}\">\n    <div sc-camel-on-click=\"{{ closeRequest }}\" style=\"position:fixed;inset:0;z-index:140;background:rgba(20,18,15,.4);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:22px;overflow:auto;animation:fade .25s both\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:540px;background:#fff;border-radius:28px;padding:clamp(24px,3vw,36px);margin:auto;animation:springIn .55s cubic-bezier(.2,1.25,.3,1) both;box-shadow:0 40px 90px rgba(20,18,15,.3)\">\n        <p style=\"margin:0;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9A948A\">30 minutes with<\u002Fp>\n        <h2 style=\"margin:8px 0 0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:34px;letter-spacing:-.032em;line-height:1\">{{ reqName }}<\u002Fh2>\n        <p style=\"margin:22px 0 8px;font-size:16.5px;font-weight:700\">I'd like to talk about<\u002Fp>\n        <div style=\"display:inline-flex;background:var(--tint);color:var(--acc-ink);border-radius:999px;padding:11px 18px;font-size:16px;font-weight:700\">{{ reqTopic }}<\u002Fdiv>\n        <p style=\"margin:24px 0 8px;font-size:16.5px;font-weight:700\">What would you like help with?<\u002Fp>\n        <textarea value=\"{{ reqNote }}\" sc-camel-on-change=\"{{ onNote }}\" placeholder=\"One or two lines is plenty…\" style=\"width:100%;min-height:92px;border:1.5px solid #E3DED5;border-radius:16px;padding:16px;font-size:16.5px;resize:vertical;outline:none;color:#14120F\" style-focus=\"border-color:var(--acc);box-shadow:0 0 0 4px var(--tint)\"><\u002Ftextarea>\n        <p style=\"margin:22px 0 10px;font-size:16.5px;font-weight:700\">Pick a time<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n          <sc-for list=\"{{ slots }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <sc-if value=\"{{ s.on }}\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"background:var(--acc);color:var(--on-acc);border:none;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ s.off }}\">\n              <button sc-camel-on-click=\"{{ s.go }}\" style=\"background:#fff;border:1.5px solid #EBE6DE;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:600;cursor:pointer;min-height:50px;transition:border-color .2s\" style-hover=\"border-color:#14120F\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:28px\">\n          <button sc-camel-on-click=\"{{ sendRequest }}\" style=\"flex:1 1 180px;background:var(--acc);color:var(--on-acc);border:none;border-radius:15px;padding:17px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.03)\">Send request<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeRequest }}\" style=\"background:none;border:1.5px solid #E3DED5;border-radius:15px;padding:17px 22px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px\" style-hover=\"border-color:#14120F\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ createOpen }}\">\n    <div sc-camel-on-click=\"{{ closeCreate }}\" style=\"position:fixed;inset:0;z-index:140;background:rgba(20,18,15,.4);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:22px;overflow:auto;animation:fade .25s both\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:540px;background:#fff;border-radius:28px;padding:clamp(24px,3vw,36px);margin:auto;animation:springIn .55s cubic-bezier(.2,1.25,.3,1) both;box-shadow:0 40px 90px rgba(20,18,15,.3)\">\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:34px;letter-spacing:-.032em;line-height:1\">Create something<\u002Fh2>\n        <p style=\"margin:10px 0 24px;font-size:17px;color:#6E6A62\">Four questions. Then it's real.<\u002Fp>\n        <sc-for list=\"{{ createFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"margin-bottom:16px\">\n            <p style=\"margin:0 0 8px;font-size:15.5px;font-weight:700\">{{ f.label }}<\u002Fp>\n            <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" style=\"width:100%;border:1.5px solid #E3DED5;border-radius:15px;padding:15px 16px;font-size:16.5px;outline:none;color:#14120F\" style-focus=\"border-color:var(--acc);box-shadow:0 0 0 4px var(--tint)\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:12px\">\n          <button sc-camel-on-click=\"{{ submitCreate }}\" style=\"flex:1 1 180px;background:var(--acc);color:var(--on-acc);border:none;border-radius:15px;padding:17px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px;transition:transform .22s cubic-bezier(.2,1.4,.3,1)\" style-hover=\"transform:scale(1.03)\">Put it out there<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeCreate }}\" style=\"background:none;border:1.5px solid #E3DED5;border-radius:15px;padding:17px 22px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px\" style-hover=\"border-color:#14120F\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ questDone }}\">\n    <div sc-camel-on-click=\"{{ closeQuestDone }}\" style=\"position:fixed;inset:0;z-index:150;background:rgba(20,18,15,.45);backdrop-filter:blur(8px);display:grid;place-items:center;padding :var(--acc);color:var(--on-acc);border:none;border-radius:15px;padding:17px 30px;font-size:17px;font-weight:700;cursor:pointer;min-height:54px\">Nice<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\">\n    <div style=\"position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:200;background:#14120F;color:#fff;border-radius:999px;padding:16px 26px;font-size:16.5px;font-weight:600;box-shadow:0 20px 50px rgba(20,18,15,.32);animation:bumpUp .35s cubic-bezier(.2,1.4,.3,1) both;max-width:90vw;text-align:center\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rhea&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Employee&quot;},&quot;newJoiner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Employee&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Random&quot;,&quot;Cobalt&quot;,&quot;Orange&quot;,&quot;Forest&quot;,&quot;Cherry&quot;,&quot;Violet&quot;,&quot;Sun&quot;],&quot;default&quot;:&quot;Random&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Identity&quot;},&quot;meetupOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Blind Meetup&quot;}}\">\nclass Component extends DCLogic {\n  PEOPLE = [\n    {id:'aarav',name:'Aarav Shah',role:'Product',loc:'Dubai',av:'#EFE6D8',initials:'AS',years:'5 years at Radix',\n     about:\"I think about how people choose a domain name all day. Before Radix I sold espresso machines, which explains a lot about my desk setup.\",\n     talk:['Domains','Product Strategy','Pricing'],learn:['Public Speaking'],into:['F1','Trekking','Espresso'],\n     now:[{ic:'📖',k:'Reading',v:'Project Hail Mary'},{ic:'🏎',k:'Watching',v:'Every F1 race twice'},{ic:'🥾',k:'Training for',v:'Wadi Ghuwayr in November'}],\n     offer:\"Happy to walk through how we price a TLD launch, or anything domains.\"},\n    {id:'maya',name:'Maya Rao',role:'Brand',loc:'London',av:'#E3E7DF',initials:'MR',years:'4 years at Radix',\n     about:\"I run brand for two of our TLDs. I grew up in Bengaluru, live in London, and spend most weekends walking somewhere with bad phone signal.\",\n     talk:['Brand','Copywriting','Design Critique'],learn:['Python','Public Speaking'],into:['Trekking','Film Photography','Cooking'],\n     now:[{ic:'📖',k:'Reading',v:'The Wager'},{ic:'🥾',k:'Training for',v:'Ben Nevis in October'},{ic:'📺',k:'Watching',v:'Severance'}],\n     offer:\"I can look at any deck, landing page or piece of copy and tell you what it's actually saying.\"},\n    {id:'daniel',name:'Daniel Visser',role:'Engineering',loc:'Amsterdam',av:'#E7E4EE',initials:'DV',years:'9 years at Radix',\n     about:\"I've been here since the registry ran on three servers and a lot of hope. I take photos of buildings on my way to nowhere in particular.\",\n     talk:['Python','System Design','Career Conversations'],learn:['Leadership'],into:['Photography','Cycling','Jazz'],\n     now:[{ic:'📷',k:'Shooting',v:'Amsterdam doorways, badly'},{ic:'📖',k:'Reading',v:'The Idea Factory'}],\n     offer:\"Nine years of Radix context, plus honest career conversations with no HR in the room.\"},\n    {id:'sarah',name:'Sarah Okoye',role:'Brand',loc:'London',av:'#F3DFD8',initials:'SO',years:'2 years at Radix',\n     about:\"I make campaigns that have to work in eleven languages. Ask me about the time we translated a pun into Japanese.\",\n     talk:['Marketing','Campaigns','Public Speaking'],learn:['Domains','Data'],into:['Running','Vinyl','Baking'],\n     now:[{ic:'🏃',k:'Training for',v:'My first half marathon'},{ic:'🎧',k:'Listening to',v:'Anything with a horn section'}],\n     offer:\"Campaign
